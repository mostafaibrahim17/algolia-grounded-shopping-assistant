<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="From Catalog to Conversation — Building a Grounded Shopping Assistant on Algolia Agent Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f77"/>
      <stop offset="0.55" stop-color="#4b57d6"/>
      <stop offset="1" stop-color="#5468ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- faint dotted texture -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/>
  </g>

  <!-- Left: title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(72,96)">
      <rect x="0" y="-26" width="196" height="34" rx="17" fill="#ffffff" opacity="0.14"/>
      <text x="18" y="-3" fill="#e9ecff" font-size="16" font-weight="600" letter-spacing="0.6">ALGOLIA · AGENT STUDIO</text>
    </g>
    <text x="72" y="176" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-0.5">From Catalog to Conversation</text>
    <text x="72" y="224" fill="#cdd4ff" font-size="24" font-weight="500">Building a Grounded Shopping Assistant</text>
    <g transform="translate(72,272)" font-size="15" font-weight="600" fill="#dfe4ff">
      <rect x="0" y="-20" width="150" height="28" rx="14" fill="#ffffff" opacity="0.10"/><text x="16" y="0">BYO-LLM · GPT-4</text>
      <rect x="164" y="-20" width="118" height="28" rx="14" fill="#ffffff" opacity="0.10"/><text x="180" y="0">Retrieval</text>
      <rect x="296" y="-20" width="120" height="28" rx="14" fill="#ffffff" opacity="0.10"/><text x="312" y="0">Grounded</text>
    </g>
  </g>

  <!-- Right: chat bubble + product cards motif -->
  <g transform="translate(880,70)" filter="url(#soft)">
    <!-- product cards grid -->
    <g>
      <rect x="0" y="0" width="110" height="130" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
      <rect x="16" y="16" width="78" height="60" rx="6" fill="#ffffff" opacity="0.22"/>
      <rect x="16" y="86" width="60" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
      <rect x="16" y="102" width="40" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

      <rect x="130" y="24" width="110" height="130" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
      <rect x="146" y="40" width="78" height="60" rx="6" fill="#ffffff" opacity="0.22"/>
      <rect x="146" y="110" width="60" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
      <rect x="146" y="126" width="40" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- chat bubble overlapping the cards -->
    <g transform="translate(38,150)">
      <rect x="0" y="0" width="230" height="86" rx="18" fill="#ffffff"/>
      <path d="M40 86 L40 112 L66 86 Z" fill="#ffffff"/>
      <circle cx="30" cy="30" r="7" fill="#5468ff"/>
      <rect x="48" y="22" width="150" height="9" rx="4.5" fill="#3a1c71" opacity="0.85"/>
      <rect x="48" y="42" width="120" height="9" rx="4.5" fill="#5468ff" opacity="0.55"/>
      <rect x="48" y="62" width="80" height="9" rx="4.5" fill="#5468ff" opacity="0.35"/>
    </g>
  </g>
</svg>
